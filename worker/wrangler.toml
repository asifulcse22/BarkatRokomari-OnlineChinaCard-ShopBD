name = "shopzone-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Secrets (set via: wrangler secret put DATABASE_URL, etc.)
# DATABASE_URL
# JWT_SECRET
# GEMINI_API_KEY

[[d1_databases]]
# Optional: uncomment if using D1 instead of Neon
# binding = "DB"
# database_name = "shopzone"
# database_id = "YOUR_D1_DATABASE_ID"
